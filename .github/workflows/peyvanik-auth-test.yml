name: Peyvanik auth and security tests
on:
  push:
    branches: [peyvanik-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check peyvanik-v2/worker.js
      - run: node --test peyvanik-v2/auth.test.js peyvanik-v2/security.test.js

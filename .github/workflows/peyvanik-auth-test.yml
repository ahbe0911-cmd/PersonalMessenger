name: Peyvanik auth security chat cloud and web tests
on:
  push:
    branches: [peyvanik-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check peyvanik-v2/worker.js && node --check peyvanik-v2/web-worker.js && node --check peyvanik-v2/web/app.js
      - run: cd peyvanik-v2 && npm test
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd peyvanik-v2 && npm install --no-save --no-package-lock playwright@1.51.1
      - run: cd peyvanik-v2 && npx playwright install --with-deps chromium
      - run: cd peyvanik-v2 && node ui-smoke.mjs

name: Peyvanik auth security chat and cloud tests
on:
  push:
    branches: [peyvanik-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check peyvanik-v2/worker.js && node --check peyvanik-v2/cloud.js
      - run: cd peyvanik-v2 && npm test

name: Build Peyvanik Keymaker
on:
  push:
    branches: [peyvanik-v2]
    paths: ['peyvanik-v2/keymaker/**', '.github/workflows/peyvanik-keymaker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish peyvanik-v2/keymaker/PeyvanikKeymaker.csproj -c Release -r win-x64 --self-contained true -o dist-keymaker
      - uses: actions/upload-artifact@v4
        with:
          name: Peyvanik-Keymaker-Windows
          path: dist-keymaker/PeyvanikKeymaker.exe
          if-no-files-found: error
          retention-days: 14

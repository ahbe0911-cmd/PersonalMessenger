name: Build Peyvanik 2.5 RC1 connected apps
on:
  push:
    branches: [peyvanik-v2]
    paths:
      - 'peyvanik-v2/android/**'
      - 'peyvanik-v2/windows/**'
      - '.github/workflows/peyvanik-preview-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check peyvanik-v2/worker.js && node --check peyvanik-v2/web-worker.js && node --check peyvanik-v2/web/app.js
      - run: cd peyvanik-v2 && npm test
      - run: cd peyvanik-v2 && npm install --no-save --no-package-lock playwright@1.51.1
      - run: cd peyvanik-v2 && npx playwright install --with-deps chromium
      - run: cd peyvanik-v2 && node ui-smoke.mjs
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: gradle --no-daemon :peyvanik-preview:assembleDebug
      - run: |
          mkdir -p dist-peyvanik-android
          mapfile -t apks < <(find peyvanik-v2/android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then exit 1; fi
          cp "${apks[0]}" dist-peyvanik-android/Peyvanik-v2.5-rc1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist-peyvanik-android/Peyvanik-v2.5-rc1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist-peyvanik-android/Peyvanik-v2.5-rc1.apk > dist-peyvanik-android/SIGNING.txt
          printf 'version=2.5.0-rc.1\ncommit=%s\nrun_id=%s\nsigning=debug\nweb_origin=https://peyvanik-web.ahbe0911.workers.dev\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist-peyvanik-android/BUILD-INFO.txt
          cd dist-peyvanik-android && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Peyvanik-Android-v2.5-RC1
          path: dist-peyvanik-android/
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate icon
        shell: powershell
        run: .\peyvanik-v2\windows\Assets\CreateIcon.ps1
      - run: dotnet publish peyvanik-v2/windows/PeyvanikPreview.csproj -c Release -r win-x64 --self-contained true -o peyvanik-v2/windows/publish
      - name: Download verified WebView2 runtime installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "peyvanik-v2/windows/MicrosoftEdgeWebview2Setup.exe"
          $sig = Get-AuthenticodeSignature "peyvanik-v2/windows/MicrosoftEdgeWebview2Setup.exe"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw "Invalid bootstrapper signature" }
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path "$([Environment]::GetFolderPath('ProgramFilesX86'))" 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
          & $iscc peyvanik-v2/windows/Setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $file = 'dist-peyvanik-win/Peyvanik-v2.5-rc1-x64-Setup.exe'
          if (!(Test-Path $file)) { throw "Missing installer" }
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  Peyvanik-v2.5-rc1-x64-Setup.exe" | Out-File dist-peyvanik-win/SHA256SUMS.txt -Encoding ascii
          @("version=2.5.0-rc.1","commit=$env:GITHUB_SHA","run_id=$env:GITHUB_RUN_ID","signing=unsigned","web_origin=https://peyvanik-web.ahbe0911.workers.dev") | Out-File dist-peyvanik-win/BUILD-INFO.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Peyvanik-Windows-v2.5-RC1
          path: dist-peyvanik-win/
          if-no-files-found: error
          retention-days: 14

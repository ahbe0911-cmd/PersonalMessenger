name: Build Peyvanik preview Android and Windows
on:
  push:
    branches: [peyvanik-v2]
    paths:
      - 'peyvanik-v2/android/**'
      - 'peyvanik-v2/windows/**'
      - '.github/workflows/peyvanik-preview-build.yml'
      - 'settings.gradle.kts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: gradle --no-daemon :peyvanik-preview:assembleDebug
      - run: |
          mkdir -p dist-peyvanik-android
          mapfile -t apks < <(find peyvanik-v2/android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then echo "Expected exactly one debug APK"; exit 1; fi
          cp "${apks[0]}" dist-peyvanik-android/Peyvanik-v2.0-preview-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist-peyvanik-android/Peyvanik-v2.0-preview-debug.apk
          cd dist-peyvanik-android && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Peyvanik-Android-Preview
          path: dist-peyvanik-android/
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish peyvanik-v2/windows/PeyvanikPreview.csproj -c Release -r win-x64 --self-contained true -o peyvanik-v2/windows/publish
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path "$([Environment]::GetFolderPath('ProgramFilesX86'))" 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
          & $iscc peyvanik-v2/windows/Setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $file = 'dist-peyvanik-win/Peyvanik-v2.0-preview-x64-Setup.exe'
          if (!(Test-Path $file)) { throw "Missing installer" }
          $hash=(Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  Peyvanik-v2.0-preview-x64-Setup.exe" | Out-File dist-peyvanik-win/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Peyvanik-Windows-Preview
          path: dist-peyvanik-win/
          if-no-files-found: error
          retention-days: 14

name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK
        run: |
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Build and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Backend health check
        run: |
          curl --fail --silent --show-error --max-time 20 https://personal-messenger-api.ahbe0911.workers.dev/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["database"]=="ready" and d["media"]=="ready"'
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PersonalMessenger-v1.5.0-debug.apk
          sha256sum dist/PersonalMessenger-v1.5.0-debug.apk > dist/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/PersonalMessenger-v1.5.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalMessenger-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کلیدساز پیونیک</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script defer src="/keymaker.js"></script></head><body><main class="login"><section class="login-card"><img src="/icon.svg" class="logo" alt=""><h1>کلیدساز پیونیک</h1><p class="muted">ایجاد حساب مستقل و کلید معتبر ورود</p><form id="make"><label>نام نمایشی<input id="name" maxlength="80" required></label><label>نام کاربری<input id="username" dir="ltr" maxlength="32" pattern="[a-zA-Z][a-zA-Z0-9_]{2,31}" required></label><label class="check"><input type="checkbox" id="accept" required>کلید را امن نگه می‌دارم؛ بازیابی خودکار وجود ندارد.</label><button id="create" class="primary">ایجاد حساب و کلید</button></form><p id="status" role="status"></p><section id="result" hidden><p>این کلید فقط یک‌بار نمایش داده می‌شود.</p><code id="key" dir="ltr"></code><button id="copy">کپی کلید</button><button id="save">ذخیره فایل متنی</button><button id="clear">پاک کردن نمایش</button></section><a href="/">رفتن به پیام‌رسان</a></section></main></body></html>
